function toast(m, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; $('#toasts').appendChild(t); setTimeout(() => t.remove(), bad ? 4600 : 2800); }
function theme(t) { document.documentElement.dataset.theme = t; localStorage.setItem('tp_theme', t); const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'dark' ? '#060d1f' : '#0b1b3a'; }
theme(localStorage.getItem('tp_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
function modal(html) { closeModal(); const o = document.createElement('div'); o.id = 'ov'; o.className = 'ov'; o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button class="x" onclick="closeModal()" aria-label="Fermer">${ic('x', 18)}</button>${html}</div>`; o.addEventListener('click', e => { if (e.target === o) closeModal(); }); document.body.appendChild(o); }
function closeModal() { const o = $('#ov'); if (o) o.remove(); }
function ask({title, text = '', ok = 'Confirmer', danger = false, input = null}) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ov center'; o.id = 'ask';
    o.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p>${input ? `<textarea id="askIn" placeholder="${esc(input)}"></textarea>` : ''}<div class="btns"><button class="btn ghost" id="askNo">Annuler</button><button class="btn ${danger ? 'danger' : 'pri'}" id="askOk">${esc(ok)}</button></div></div>`;
    document.body.appendChild(o);
    const done = v => { o.remove(); res(v); };
    o.querySelector('#askNo').onclick = () => done(null);
    o.querySelector('#askOk').onclick = () => { if (input) { const v = o.querySelector('#askIn').value.trim(); if (v.length < 3) { o.querySelector('#askIn').classList.add('bad'); return; } done(v); } else done(true); };
    o.addEventListener('click', e => { if (e.target === o) done(null); });
  });
}

// ---------- Données ----------
const tontine = () => S.ms[S.cur] && S.ms[S.cur].tontines;
const role = () => S.ms[S.cur] && S.ms[S.cur].role;
const isAdmin = () => ['admin_principal', 'admin_validateur'].includes(role());
const isPrincipal = () => role() === 'admin_principal';
const myMemberId = () => S.ms[S.cur] && S.ms[S.cur].id;
const tid = () => S.ms[S.cur].tontine_id;
const mname = id => { const m = S.members.find(x => x.id === id); return m && m.users ? m.users.full_name : 'Membre'; };

function periodStart(type, d = new Date()) {
  if (type === 'weekly') { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); }
  return iso(new Date(d.getFullYear(), d.getMonth(), 1));
}
function standing() {
  const t = tontine(); if (!t) return [];
  const ps = periodStart(t.period), limit = new Date(ps); limit.setDate(limit.getDate() + (t.grace_days || 0));
  return S.members.filter(m => m.status === 'active').map(m => {
    const paid = S.contribs.filter(c => c.member_id === m.id && c.period_start === ps).reduce((a, c) => a + Number(c.amount), 0);
    const st = paid >= t.contribution_amount ? 'ok' : (new Date() > limit ? 'late' : 'due');
    return {...m, paid, st};
  });
}
function periodName() { const t = tontine(); return t.period === 'weekly' ? 'cette semaine' : 'ce mois'; }
function periodLabel(c) { const t = tontine(), d = new Date(c.period_start); return t.period === 'weekly' ? 'Semaine du ' + fdate(c.period_start) : d.toLocaleDateString('fr-FR', {month:'long', year:'numeric'}); }
async function loadTontine() {
  if (!S.ms[S.cur]) return;
  const sb = S.sb, id = tid();
  const [mem, con, rc, wd, bal, nt] = await Promise.all([
    sb.from('tontine_members').select('id,user_id,role,status,users!tontine_members_user_id_fkey(full_name,phone,email)').eq('tontine_id', id).order('joined_at'),
    sb.from('contributions').select('id,member_id,kind,amount,period_start,paid_at,method,tx_reference,note,recorded_by,corrects_id').eq('tontine_id', id).order('paid_at', {ascending:false}).limit(1000),
    sb.from('contribution_receipts').select('contribution_id,receipt_number,issued_at').eq('tontine_id', id),
    sb.from('withdrawal_requests').select('id,amount,reason,beneficiary,withdrawal_date,status,execution_reference,created_at').eq('tontine_id', id).order('created_at', {ascending:false}).limit(100),
    sb.from('tontine_balances').select('balance,total_in,total_out').eq('tontine_id', id).maybeSingle(),
    sb.from('notifications').select('id,title,body,read_at,created_at').eq('user_id', S.user.id).order('created_at', {ascending:false}).limit(50)
  ]);
  const e = mem.error || con.error || rc.error || wd.error || bal.error || nt.error; if (e) throw e;
  S.members = mem.data || []; S.contribs = con.data || []; S.wds = wd.data || [];
  S.rcpt = {}; (rc.data || []).forEach(r => S.rcpt[r.contribution_id] = r);
  S.bal = bal.data || {balance:0, total_in:0, total_out:0}; S.notifs = nt.data || []; S.last = Date.now();
}
async function boot() {
  const {data:{session}} = await S.sb.auth.getSession();
  if (!session) { S.user = null; return render(); }
  S.user = session.user; S.loading = true; S.err = ''; render();
  try {
    const [p, m] = await Promise.all([
      S.sb.from('users').select('id,full_name,phone,email').eq('id', S.user.id).maybeSingle(),
      S.sb.from('tontine_members').select('id,tontine_id,role,status,tontines(name,contribution_amount,period,grace_days)').eq('user_id', S.user.id).eq('status', 'active')
    ]);
    if (p.error || m.error) throw (p.error || m.error);
    S.profile = p.data; S.ms = m.data || []; S.cur = 0;
    if (S.ms.length) await loadTontine();
  } catch (e) { S.err = "Impossible de charger les données. Vérifie ta connexion puis réessaie."; console.error(e); }
  S.loading = false; render();
}
async function refresh(quiet) { try { await loadTontine(); if (!quiet) toast('Données à jour'); } catch (e) { toast('Actualisation impossible', true); } render(); }
async function switchTontine(i) { S.cur = +i; S.loading = true; render(); try { await loadTontine(); } catch (e) { S.err = 'Erreur de chargement.'; } S.loading = false; render(); }
function go(v) { S.view = v; render(); scrollTo(0, 0); }

// ---------- Connexion ----------
function normPhone(raw) { const s = String(raw).trim(); let d = s.replace(/\D/g, ''); if (s.startsWith('+')) return d; if (d.startsWith('00')) d = d.slice(2); if (d.startsWith('0') && d.length === 10) return '225' + d; return d.startsWith('225') ? d : '225' + d; }
function togglePin() { const i = $('#pin'); i.type = i.type === 'password' ? 'text' : 'password'; $('.eye').innerHTML = ic(i.type === 'password' ? 'eye' : 'eyeoff'); }
async function login(ev) {
  if (ev) ev.preventDefault();
  const phone = $('#ph').value, pin = $('#pin').value, err = $('#err'), btn = $('#go');
  $('#ph').classList.remove('bad'); $('#pin').classList.remove('bad');
  if (normPhone(phone).length < 11) { err.textContent = 'Saisis ton numéro de téléphone.'; $('#ph').classList.add('bad'); return; }
  if (!/^\d{6}$/.test(pin)) { err.textContent = 'Le code PIN contient 6 chiffres.'; $('#pin').classList.add('bad'); return; }
  btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = '';
  const {error} = await S.sb.auth.signInWithPassword({email: normPhone(phone) + '@phone.tontinepro.app', password: pin});
  if (error) {
    err.textContent = /fetch|network/i.test(error.message) ? 'Connexion impossible. Vérifie ton réseau.' : 'Numéro ou code PIN incorrect.';
    btn.disabled = false; btn.textContent = 'Se connecter'; return;
  }
  S.view = 'home'; boot();
}
async function logout() { if (await ask({title:'Se déconnecter ?', text:'Tu devras ressaisir ton numéro et ton code PIN.', ok:'Se déconnecter'})) { await S.sb.auth.signOut(); S.user = null; S.ms = []; render(); } }

function openReceipt(cid) {

  modal(`<h3>${r ? 'Reçu de cotisation' : 'Opération de correction'}</h3>

  <div class="tot"><span class="muted" style="font-size:12px">Montant</span><b class="${c.amount < 0 ? 'red' : ''}">${fcfa(c.amount)}</b></div>
  ${kv('Membre', mname(c.member_id))}${kv('Date', fdate(c.paid_at))}${kv('Période', periodLabel(c))}${kv('Mode', METHOD[c.method] || c.method)}${c.tx_reference ? kv('Référence', c.tx_reference) : ''}${c.note ? kv('Motif', c.note) : ''}${kv('Enregistré par', by && by.users ? by.users.full_name : '—')}</div>
  ${corrected ? `<div class="note" style="margin-bottom:10px">${ic('clock', 18)}<span>Cette cotisation a été annulée par une correction.</span></div>` : ''}

  ${isPrincipal() && c.kind === 'payment' && !corrected ? `<button class="btn ghost block red" onclick="reverse('${esc(cid)}')">Annuler cette cotisation</button>` : ''}</div>`);
}
function shareReceipt(cid) {
  const c = S.contribs.find(x => x.id === cid), r = S.rcpt[cid], t = tontine();
  const txt = `${t.name}\nReçu ${r ? r.receipt_number : ''}\nMembre : ${mname(c.member_id)}\nMontant : ${fcfa(c.amount)}\nDate : ${fdate(c.paid_at)}\nMode : ${METHOD[c.method] || c.method}`;

async function reverse(cid) {
  const reason = await ask({title:'Annuler cette cotisation ?', text:'Une opération de correction traçable sera créée. Indique le motif.', ok:'Annuler la cotisation', danger:true, input:'Motif de la correction (obligatoire)'});

  const {error} = await S.sb.rpc('reverse_contribution', {p_contribution: cid, p_reason: reason});
  if (error) { toast(error.message, true); return; }
  closeModal(); toast('Correction enregistrée'); await refresh(true);
}

async function submitPin() {
  const p1 = $('#p1').value, p2 = $('#p2').value, err = $('#p_err'), b = $('#p_go');
  if (!/^\d{6}$/.test(p1)) { err.textContent = 'Le code doit contenir 6 chiffres.'; return; }

  if (/^(\d)\1{5}$/.test(p1) || ['123456', '654321', '012345'].includes(p1)) { err.textContent = 'Ce code est trop facile à deviner.'; return; }

  closeModal(); toast('Code PIN modifié');

function chartSvg() {
  const months = []; for (let i = 5; i >= 0; i--) { const d = new Date(); d.setMonth(d.getMonth() - i, 1); months.push({k: iso(d).slice(0, 7), l: d.toLocaleDateString('fr-FR', {month:'short'}).replace('.', ''), v: 0}); }
  S.contribs.forEach(c => { const m = months.find(x => x.k === String(c.paid_at).slice(0, 7)); if (m) m.v += Number(c.amount); });
  const max = Math.max(1, ...months.map(m => m.v)), W = 360, H = 170, bw = 34, gap = (W - 6 * bw) / 7;
  const bars = months.map((m, i) => { const h = Math.max(4, Math.round(m.v / max * 105)), x = gap + i * (bw + gap), y = 130 - h, last = i === 5; return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="9" fill="${last ? '#10b981' : 'currentColor'}" opacity="${last ? 1 : .18}"/><text x="${x + bw / 2}" y="${y - 7}" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" opacity="${m.v ? .8 : 0}">${fmtK(m.v)}</text><text x="${x + bw / 2}" y="152" text-anchor="middle" font-size="12" fill="currentColor" opacity=".55">${esc(m.l)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cotisations des 6 derniers mois" style="color:var(--text)"><line x1="0" y1="131" x2="${W}" y2="131" stroke="currentColor" opacity=".12"/>${bars}</svg>`;
}
function ringSvg(pct) {
  const C = 2 * Math.PI * 42, d = Math.max(0, Math.min(1, pct)) * C;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${Math.round(pct * 100)} % à jour"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface2)" stroke-width="11"/><circle cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${Math.round(pct * 100)}%</text></svg>`;
}
function vHome() {
  const t = tontine(), st = standing(), ok = st.filter(x => x.st === 'ok'), late = st.filter(x => x.st === 'late'), me = st.find(x => x.id === myMemberId());
  const pct = st.length ? ok.length / st.length : 0, collected = st.reduce((a, x) => a + x.paid, 0), expected = st.length * t.contribution_amount;
  const first = ((S.profile && S.profile.full_name) || '').split(' ')[0] || '', today = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const pend = S.wds.filter(w => ['en_attente', 'en_attente_validation', 'autorisee'].includes(w.status));
  let n = 0; const i = () => `style="--i:${n++}"`;
  const side = isAdmin() ? `<div class="card rise" ${i()}><h3>À relancer <small>${late.length} en retard</small></h3>${late.length ? late.map(m => `<div class="item">${avatar(m.users.full_name)}<div class="t"><b>${esc(m.users.full_name)}</b><span>Manque ${fcfa(t.contribution_amount - m.paid)}</span></div><button class="mini" onclick="relance('${esc(m.id)}')">${ic('chat', 16)} Relancer</button></div>`).join('') : `<div class="empty">${ic('check', 30)}Tout le monde est à jour.</div>`}</div>`
    : `<div class="card rise" ${i()}><h3>Ma situation</h3>${me ? `<div class="item" style="border:0">${avatar((S.profile || {}).full_name, 46)}<div class="t"><b>${me.st === 'ok' ? 'Tu es à jour' : me.st === 'late' ? 'Tu es en retard' : 'Cotisation à régler'}</b><span>${fcfa(me.paid)} versés sur ${fcfa(t.contribution_amount)} ${periodName()}</span></div><span class="badge b-${me.st === 'ok' ? 'em' : me.st === 'late' ? 'red' : 'amber'}">${me.st === 'ok' ? 'À jour' : me.st === 'late' ? 'En retard' : 'À payer'}</span></div>` : '<div class="empty">Aucune information.</div>'}</div>`;
  return `<div class="muted" style="margin:2px 2px 14px;text-transform:capitalize">${esc(today)}</div>
  <h2 style="font-size:22px;margin:-6px 2px 14px">Bonjour${first ? ', ' + esc(first) : ''}</h2>
  <div class="dash">
   <div class="card hero rise" ${i()}><div class="lbl">Solde total disponible</div><div class="big">${fcfa(S.bal.balance)}</div><div class="duo"><div><small>Entrées</small><b>${fcfa(S.bal.total_in)}</b></div><div><small>Sorties</small><b>${fcfa(S.bal.total_out)}</b></div></div></div>
   <div class="card rise" ${i()}><h3>Collecte ${periodName()}</h3><div class="ring">${ringSvg(pct)}<div class="tx"><b>${ok.length}/${st.length}</b><span class="muted">membres à jour</span><div style="margin-top:6px;font-size:13px">${fcfa(collected)} <span class="muted">sur ${fcfa(expected)}</span></div></div></div></div>
   <div class="tiles rise" ${i()}><div class="card tile"><div class="k">Membres actifs</div><div class="n">${st.length}</div></div><div class="card tile"><div class="k">En retard</div><div class="n ${late.length ? 'red' : ''}">${late.length}</div></div><div class="card tile"><div class="k">Cotisation</div><div class="n">${fcfa(t.contribution_amount)}</div></div><div class="card tile"><div class="k">Retraits</div><div class="n">${fcfa(S.bal.total_out)}</div></div></div>
   ${side}
   <div class="card chart rise" ${i()}><h3>Cotisations <small>6 derniers mois</small></h3>${chartSvg()}</div>
   <div class="card rise" ${i()}><h3>Derniers mouvements</h3>${S.contribs.length ? S.contribs.slice(0, 6).map(payItem).join('') : `<div class="empty">${ic('inbox', 30)}Aucun paiement enregistré.</div>`}</div>
   ${isAdmin() && pend.length ? `<div class="card span2 rise" ${i()}><h3>Retraits en cours</h3>${wdItems(pend)}</div>` : ''}
  </div>`;
}
function memberItems() {
  const L = {ok:['À jour','em'], late:['En retard','red'], due:['À payer','amber'], off:['Inactif','gray']}, qq = S.q.toLowerCase(), map = {};
  standing().forEach(s => map[s.id] = s.st);
  const r = S.members.filter(m => (!qq || (m.users && m.users.full_name.toLowerCase().includes(qq))) && (S.filter === 'all' || (map[m.id] || 'off') === S.filter));
  return r.length ? r.map(m => { const st = map[m.id] || 'off'; return `<button class="item tap" onclick="openMember('${esc(m.id)}')">${avatar(m.users && m.users.full_name)}<div class="t"><b>${esc(m.users ? m.users.full_name : 'Membre')}</b><span>${esc(ROLE[m.role])}${isAdmin() && m.users ? ' · ' + esc(fmtPhone(m.users.phone)) : ''}</span></div><span class="badge b-${L[st][1]}">${L[st][0]}</span></button>`; }).join('') : `<div class="empty">${ic('search', 30)}Aucun membre trouvé.</div>`;
}
function openMember(id) { S.sel = id; go('member'); }
function vMembers() {
  const F = [['all', 'Tous'], ['ok', 'À jour'], ['late', 'En retard'], ['due', 'À payer'], ['off', 'Inactifs']];
  return `<div class="search">${ic('search')}<input id="q" placeholder="Rechercher un membre" value="${esc(S.q)}" oninput="S.q=this.value;document.querySelector('#ml').innerHTML=memberItems()"></div>
  <div class="chips">${F.map(([k, l]) => `<button class="chip ${S.filter === k ? 'on' : ''}" onclick="S.filter='${k}';render()">${l}</button>`).join('')}</div>
  ${isPrincipal() ? `<button class="btn dark block" style="margin-bottom:14px" onclick="openAdd()">${ic('plus')} Ajouter un membre</button>` : ''}
  <div class="card" id="ml" style="padding-top:6px;padding-bottom:6px">${memberItems()}</div>`;
}
function vMember() {
  const m = S.members.find(x => x.id === S.sel); if (!m) return '<div class="empty">Membre introuvable.</div>';
  const t = tontine(), mine = S.contribs.filter(c => c.member_id === m.id), total = mine.reduce((a, c) => a + Number(c.amount), 0), s = standing().find(x => x.id === m.id), nm = m.users ? m.users.full_name : 'Membre';
  const badge = !s ? ['Inactif', 'gray'] : s.st === 'ok' ? ['À jour', 'em'] : s.st === 'late' ? ['En retard', 'red'] : ['À payer', 'amber'];
  return `<button class="btn ghost sm" style="margin:0 0 12px -8px;border:0" onclick="go('members')">${ic('back', 18)} Membres</button>
  <div class="dash"><div class="stack"><div class="card" style="text-align:center">${avatar(nm, 76)}<h2 style="font-size:21px;margin:10px 0 4px">${esc(nm)}</h2><div class="muted" style="margin-bottom:10px">${esc(ROLE[m.role])}</div><span class="badge b-${badge[1]}">${badge[0]}</span>
   ${isAdmin() && m.users ? `<div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><a class="btn sm" href="tel:${esc(m.users.phone)}" style="text-decoration:none">${ic('phone', 18)} Appeler</a><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${esc(m.users.phone.replace(/\D/g, ''))}" style="text-decoration:none">${ic('chat', 18)} WhatsApp</a></div><div class="muted" style="margin-top:12px;font-size:13px">${esc(fmtPhone(m.users.phone))}</div>` : ''}</div>
   <div class="tiles" style="grid-template-columns:1fr 1fr"><div class="card tile"><div class="k">Total versé</div><div class="n">${fcfa(total)}</div></div><div class="card tile"><div class="k">${periodName()[0].toUpperCase() + periodName().slice(1)}</div><div class="n">${s ? fcfa(s.paid) : '—'}</div></div></div>
   ${isPrincipal() ? `<div style="display:grid;gap:10px">${m.status === 'active' ? `<button class="btn pri block" onclick="openPay('${esc(m.id)}')">${ic('wallet')} Enregistrer une cotisation</button>` : ''}<button class="btn block" onclick="openEdit('${esc(m.id)}')">${ic('pen', 18)} Modifier les informations</button>${m.role === 'member' ? `<button class="btn ghost block ${m.status === 'active' ? 'red' : ''}" onclick="toggleStatus('${esc(m.id)}')">${m.status === 'active' ? 'Désactiver le compte' : 'Réactiver le compte'}</button>` : ''}</div>` : ''}</div>
   <div class="card"><h3>Historique <small>${mine.length} opération${mine.length > 1 ? 's' : ''}</small></h3>${mine.length ? mine.map(payItem).join('') : `<div class="empty">${ic('inbox', 30)}Aucune cotisation.</div>`}</div></div>`;
}
function vContribs() {
  const list = S.contribs.filter(c => !S.mine || c.member_id === myMemberId()), groups = {};
  list.forEach(c => { const k = String(c.paid_at).slice(0, 7); (groups[k] = groups[k] || []).push(c); });
  const keys = Object.keys(groups).sort().reverse();
  return `<div class="chips"><button class="chip ${S.mine ? '' : 'on'}" onclick="S.mine=false;render()">Toutes</button><button class="chip ${S.mine ? 'on' : ''}" onclick="S.mine=true;render()">Les miennes</button></div>
  ${keys.length ? keys.map(k => { const tot = groups[k].reduce((a, c) => a + Number(c.amount), 0); return `<div class="grp"><span>${esc(new Date(k + '-01').toLocaleDateString('fr-FR', {month:'long', year:'numeric'}))}</span><span>${fcfa(tot)}</span></div><div class="card" style="padding-top:6px;padding-bottom:6px">${groups[k].map(payItem).join('')}</div>`; }).join('') + '<p class="muted" style="text-align:center;font-size:12px;margin-top:14px">Touche une ligne pour ouvrir le reçu.</p>' : `<div class="card"><div class="empty">${ic('inbox', 34)}Aucune cotisation.</div></div>`}`;
}
function wdItems(rows) {
  return rows.map(w => { const s = STATUS[w.status] || [w.status, 'gray']; return `<div class="item"><div class="t"><b>${esc(w.reason)}</b><span>${fdate(w.withdrawal_date)} · ${esc(w.beneficiary)}</span></div><div style="text-align:right"><div class="amt">${fcfa(w.amount)}</div><span class="badge b-${s[1]}">${s[0]}</span></div></div>`; }).join('');
}
function vWds() {
  return `${isAdmin() ? `<div class="note" style="margin-bottom:14px">${ic('lock', 18)}<span>Les demandes de retrait avec double validation par code seront disponibles prochainement. Cette page affiche déjà tous les retraits.</span></div>` : ''}
  <div class="card" style="padding-top:6px;padding-bottom:6px">${S.wds.length ? wdItems(S.wds) : `<div class="empty">${ic('lock', 34)}Aucun retrait pour le moment.</div>`}</div>`;
}
function vAlerts() {
  const unread = S.notifs.some(n => !n.read_at);
  return `${unread ? `<button class="btn sm" style="margin-bottom:12px" onclick="readAll()">${ic('check', 18)} Tout marquer comme lu</button>` : ''}<div class="card" style="padding-top:6px;padding-bottom:6px">${S.notifs.length ? S.notifs.map(n => `<button class="item tap" onclick="readN('${esc(n.id)}')"><div class="av" style="--h:${n.read_at ? 220 : 160};width:38px;height:38px">${ic('bell', 18)}</div><div class="t"><b style="${n.read_at ? 'font-weight:500' : ''}">${esc(n.title)}</b><span>${esc(n.body || '')} · ${fdate(n.created_at)}</span></div>${n.read_at ? '' : '<span class="badge b-em">Nouveau</span>'}</button>`).join('') : `<div class="empty">${ic('bell', 34)}Aucune notification.</div>`}</div>`;
}
async function readN(id) { const {error} = await S.sb.from('notifications').update({read_at: new Date().toISOString()}).eq('id', id); if (!error) { const n = S.notifs.find(x => x.id === id); if (n) n.read_at = new Date().toISOString(); render(); } }
async function readAll() { const {error} = await S.sb.from('notifications').update({read_at: new Date().toISOString()}).eq('user_id', S.user.id).is('read_at', null); if (error) { toast('Action impossible', true); return; } S.notifs.forEach(n => n.read_at = n.read_at || new Date().toISOString()); render(); }
function vProfile() {
  const p = S.profile || {}, t = tontine(), dark = document.documentElement.dataset.theme === 'dark';
  return `<div class="dash"><div class="stack"><div class="card" style="text-align:center">${avatar(p.full_name, 76)}<h2 style="font-size:21px;margin:10px 0 4px">${esc(p.full_name)}</h2><div class="muted">${esc(fmtPhone(p.phone))}</div><div style="margin-top:10px"><span class="badge b-gray">${esc(ROLE[role()])}</span></div></div>
   ${S.ms.length > 1 ? `<div class="card"><label for="tsel">Tontine</label><select id="tsel" onchange="switchTontine(this.value)">${S.ms.map((m, i) => `<option value="${i}" ${i === S.cur ? 'selected' : ''}>${esc(m.tontines.name)}</option>`).join('')}</select></div>` : ''}</div>
   <div class="stack"><div class="card"><h3>${esc(t.name)}</h3><div class="kv"><span>Cotisation</span><span>${fcfa(t.contribution_amount)}</span></div><div class="kv"><span>Périodicité</span><span>${t.period === 'weekly' ? 'Hebdomadaire' : 'Mensuelle'}</span></div><div class="kv"><span>Membres actifs</span><span>${S.members.filter(m => m.status === 'active').length}</span></div></div>
   <div class="card" style="padding-top:6px;padding-bottom:6px"><button class="sw" onclick="theme(document.documentElement.dataset.theme==='dark'?'light':'dark');render()"><span style="display:flex;gap:10px;align-items:center">${ic('moon')} Mode sombre</span><i></i></button></div>
   <button class="btn block" onclick="openPin()">${ic('lock', 18)} Changer mon code PIN</button><button class="btn ghost block red" onclick="logout()">${ic('out', 18)} Se déconnecter</button></div></div>`;
}
function skeleton() { return `<div class="page"><div class="sk" style="height:26px;width:50%;margin-bottom:14px"></div><div class="dash"><div class="sk" style="height:170px"></div><div class="sk" style="height:170px"></div><div class="sk" style="height:90px"></div><div class="sk" style="height:200px"></div></div></div>`; }

const NAV = [['home','home','Accueil'], ['members','users','Membres'], ['contribs','wallet','Cotisations'], ['wds','lock','Retraits'], ['profile','user','Profil']];
const VIEWS = {home:vHome, members:vMembers, member:vMember, contribs:vContribs, wds:vWds, alerts:vAlerts, profile:vProfile};

function render() {
  const app = $('#app');
  if (!configured) { app.innerHTML = '<div class="lg"><section class="lg-form"><form><h2>Configuration requise</h2><p class="muted">Ouvre le fichier index.html et remplace SUPABASE_URL et SUPABASE_ANON_KEY en haut du script.</p></form></section></div>'; return; }
  if (!S.user) { document.title = 'TONTINE PRO · Connexion'; app.innerHTML = vLogin(); return; }
  if (S.loading) { app.innerHTML = skeleton(); return; }
  if (S.err) { app.innerHTML = `<div class="page"><div class="card"><div class="empty">${esc(S.err)}</div><button class="btn pri block" onclick="boot()">Réessayer</button><button class="btn ghost block" style="margin-top:8px" onclick="logout()">Se déconnecter</button></div></div>`; return; }
  if (!S.ms.length) { app.innerHTML = `<div class="page"><div class="card"><div class="empty">Ton compte n’est rattaché à aucune tontine. Contacte l’administrateur.</div><button class="btn ghost block" onclick="logout()">Se déconnecter</button></div></div>`; return; }
  const unread = S.notifs.filter(n => !n.read_at).length, t = tontine(), on = S.view === 'member' ? 'members' : S.view, p = S.profile || {};
  document.title = t.name + ' · TONTINE PRO';
  const dot = unread ? `<span class="dot">${unread}</span>` : '';
  app.innerHTML = `<div class="app">
   <aside class="side"><div class="brand">${logo(40)}<div><b>TONTINE PRO</b><small>${esc(t.name)}</small></div></div>
    <nav>${NAV.map(([k, i, l]) => `<button class="${on === k ? 'on' : ''}" onclick="go('${k}')">${ic(i)} ${l}</button>`).join('')}<button class="${on === 'alerts' ? 'on' : ''}" onclick="go('alerts')">${ic('bell')} Notifications ${unread ? `<span class="dot">${unread}</span>` : ''}</button></nav>
    <div class="me">${avatar(p.full_name, 38)}<div class="t"><b>${esc(p.full_name)}</b><span>${esc(ROLE[role()])}</span></div></div></aside>
   <div class="content"><header class="top"><div class="only-m">${logo(36)}</div><div class="ttl"><b class="only-d">${PAGES[S.view]}</b><b class="only-m">${esc(t.name)}</b><span class="only-m">${esc(ROLE[role()])}</span></div>
     ${isPrincipal() ? `<button class="btn pri sm" onclick="openPicker()" aria-label="Encaisser une cotisation">${ic('plus', 18)}<span class="bl">Encaisser</span></button>` : ''}
     <button class="ib" onclick="refresh()" aria-label="Actualiser">${ic('refresh', 19)}</button><button class="ib only-m" onclick="go('alerts')" aria-label="Notifications">${ic('bell', 19)}${dot}</button></header>
    <main class="page">${VIEWS[S.view]()}</main></div>
   <nav class="tabbar">${NAV.map(([k, i, l]) => `<button class="${on === k ? 'on' : ''}" onclick="go('${k}')"><i>${ic(i, 20)}</i>${l}</button>`).join('')}</nav></div>`;
}

if (configured) {
  S.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  S.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.user = null; render(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && S.ms.length && Date.now() - S.last > 60000) refresh(true); });
  boot();
} else render();
</script>
